  <text x="54" y="62" fill="#a371f7" font-family="Segoe UI,Inter,Arial" font-size="18" font-weight="700" letter-spacing="1.6">FLAGSHIP PROJECT 02</text>
  <text x="54" y="112" fill="#f0f6fc" font-family="Segoe UI,Inter,Arial" font-size="36" font-weight="750">PromptLab</text>
  <text x="54" y="150" fill="#8b949e" font-family="Segoe UI,Inter,Arial" font-size="20">Turn vague intent into structured prompts — then challenge the result.</text>

  <g font-family="Segoe UI,Inter,Arial">
