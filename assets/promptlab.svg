    <text x="76" y="250" fill="#c9d1d9" font-size="17">Four prompt variants are generated independently.</text>
    <text x="76" y="275" fill="#c9d1d9" font-size="17">Quality is judged twice: rules + LLM.</text>
    <text x="76" y="300" fill="#c9d1d9" font-size="17">Large disagreements are explicitly flagged.</text>
  </g>

